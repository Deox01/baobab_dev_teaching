<html lang="en">
  <head>

    <title>learning js || fundamentals</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <section class="container">
      <form>
        <h3>Suppression du compte</h3>
        <input type="text" id="phrase-key" placeholder="Je souhaite..."/>

      </form>
    </section>
    <script src="script.js"></script>
  </body>
