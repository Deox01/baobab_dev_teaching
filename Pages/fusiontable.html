<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau fusionne</title>
  </head>
  <body>
    <h1>FUSION DU TABLEAU</h1>
    <table border="1">
      <tr>
        <th colspan="7">PLANING DES TACHES PAR </th>
      </tr>
      <tr>
        <th  rowspan="2">Equipes</th>
        <th colspan="6">Janvier</th>
      </tr>
      <tr>
        <th>Lundi</th>
        <th>Mardi</th>
        <th>Mercredi</th>
        <th>Jeudi</th>
        <th>Vendredi</th>
      </tr>
      <tr>
        <td>Equipe 1</td>
        <td colspan="3">Tache 1</td>
        <td colspan="2">Tache 2</td>
        <td rowspan="2">semaine 1</td>
      </tr>
      <tr>
        <td>Equipe 2</td>
        <td colspan="2">Equipe 1</td>
        <td colspan="3">Equipe 2</td>

      </tr>
      <tr>
        <td>Equipe 1</td>
        <td>Tache 3</td>
        <td colspan="2">Tache 4</td>
        <td colspan="2">Tache 5</td>
        <td rowspan="2">Semain 2</td>
      </tr>
      <tr>
        <td>Equipe 2</td>
        <td colspan="2">Tache 3</td>
        <td colspan="3">Tache 4</td>
      </tr>
    </table>
  </body>
</html>
