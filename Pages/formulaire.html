<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire page</title>
    <h1>LE FORMULAIRE</h1>
    <form>
      <label for="nom">Nom :</label> <br />
      <input type="text" id="nom" /> <br />
      <br />
      <label for="postnom">Post Nom :</label>
      <input type="text" id="postnom" placeholder="Entrer votre postnom" />
      <br />
      <br />
      <label for="prenom">Prenom :</label>
      <input type="text" id="prenom" /> <br />
      <br />
      <label for="email">E-mail :</label>
      <input type="email" id="email" /> <br />
      <br />

      <label for="phone">Telephone :</label>
      <input type="tel" id="phone" /> <br /><br />

      <label for="age">Age :</label>
      <input type="number" id="age" /> <br />
      <br />

      <label for="birthday">Date de naissance :</label>
      <input type="date" id="birthday" /> <br />
      <br />

      <label for="heure">Heure :</label>
      <input type="time" id="heure" /> <br />
      <br />

      <label for="photo">Profil :</label>
      <input type="file" id="photo" /> <br />
      <br />

      <label for="password">Mot de passe :</label>
      <input type="password" id="password" /> <br />
      <br />
      <input type="radio" name="sexe" value="M" checked /> Masculin <br />
      <br />
      <input type="radio" name="sexe" value="F" /> Feminin <br />
      <br />

      <input type="checkbox" name="language" value="html" /> HTML
      <input type="checkbox" name="language" value="css" /> CSS
      <input type="checkbox" name="language" value="javaScript" /> JavaScript
      <input type="checkbox" name="language" value="python" /> Python
      <input type="checkbox" name="language" value="php" /> PHP
    </form>
  </head>
  <body></body>
</html>
